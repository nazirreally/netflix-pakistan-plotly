name: Build and Commit Plotly Site
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_static.py
      - run: python scripts/build_static.py --verify
      - name: Commit generated static dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/plotly.min.js docs/assets/preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "build: publish generated interactive Plotly dashboard"
            git push
          fi
