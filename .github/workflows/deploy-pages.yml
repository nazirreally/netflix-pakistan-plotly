name: Publish Netflix Analytics Demo

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "data/**"
      - "src/**"
      - "scripts/**"
      - "requirements*.txt"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deployment"
  cancel-in-progress: false

jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo disabled)"
          if [ "$mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not configured for GitHub Actions. Enable it once in Settings > Pages, or run the setup CLI script." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: pages-status
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression and Streamlit smoke tests
        run: python -m pytest -q
      - name: Rebuild and validate offline HTML report
        run: |
          python scripts/build_static.py
          python scripts/build_static.py --verify
          touch docs/.nojekyll
          test -s docs/index.html
          test -s docs/assets/plotly.min.js
          grep -q 'assets/plotly.min.js' docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTML and Plotly bundle
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          ready=false
          for i in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 25 "$base/" -o /tmp/netflix-index.html \
               && grep -q 'Netflix Pakistan' /tmp/netflix-index.html; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          curl -fsSL "$base/assets/plotly.min.js" -o /tmp/plotly.min.js
          test "$(wc -c < /tmp/plotly.min.js)" -gt 1000000
          grep -q 'plotly-graph-div' /tmp/netflix-index.html
          echo "Live Netflix dashboard and Plotly bundle returned successfully: $base/" >> "$GITHUB_STEP_SUMMARY"
